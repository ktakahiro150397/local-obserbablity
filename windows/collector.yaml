receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
      grpc:
        endpoint: 127.0.0.1:14317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/usage:
    error_mode: propagate
    traces:
      span:
      - Len(links) > 0
      - not ((resource.attributes["service.name"] == "backup-secretary-hermes" and
        attributes["usage.contract"] == "hermes.request.v1" and name == "gen_ai.request")
        or ((resource.attributes["service.name"] == "codex_exec" or resource.attributes["service.name"]
        == "codex-app-server" or resource.attributes["service.name"] == "Codex Desktop")
        and name == "session_task.turn") or (attributes["usage.contract"] == "gen_ai.request.v1"
        and name == "gen_ai.request"))
      spanevent:
      - 'true'
  transform/privacy:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.instance.id"])
    - context: scope
      statements:
      - keep_keys(attributes, [])
      - set(name, "usage")
      - set(version, "")
    - context: span
      statements:
      - keep_keys(attributes, ["usage.contract", "usage.turn.id", "usage.session.id",
        "usage.parent.turn.id", "usage.parent.session.id", "usage.transport", "usage.attribution",
        "usage.user.id", "usage.thread.kind", "usage.thread.id", "usage.channel.id",
        "usage.profile", "usage.request.id", "usage.quality", "usage.outcome", "usage.retry",
        "gen_ai.request.model", "gen_ai.response.model", "gen_ai.provider.name", "gen_ai.system",
        "conversation.id", "gen_ai.conversation.id", "turn.id", "thread.id", "codex.turn.token_usage.cache_write_input_tokens",
        "model", "usage.tokens.input", "usage.tokens.output", "usage.tokens.total",
        "usage.tokens.cache_read", "usage.tokens.cache_write", "usage.tokens.reasoning",
        "codex.turn.token_usage.input_tokens", "codex.turn.token_usage.output_tokens",
        "codex.turn.token_usage.total_tokens", "codex.turn.token_usage.cached_input_tokens",
        "codex.turn.token_usage.reasoning_output_tokens", "gen_ai.usage.input_tokens",
        "gen_ai.usage.output_tokens", "gen_ai.usage.cache_read.input_tokens", "codex.usage.total_tokens",
        "codex.usage.reasoning_output_tokens"])
      - set(status.message, "")
      - set(trace_state, "")
exporters:
  otlphttp/usage:
    endpoint: http://127.0.0.1:14320
    encoding: json
    compression: none
    timeout: 3s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 67108864
      num_consumers: 1
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 168h
extensions:
  file_storage:
    directory: ${env:USAGE_RUNTIME_DIR}/queue
    max_size: 134217728
    fsync: true
    create_directory: true
    compaction:
      directory: ${env:USAGE_RUNTIME_DIR}/queue/compact
      on_start: true
      on_rebound: true
      rebound_needed_threshold_mib: 16
      rebound_trigger_threshold_mib: 8
  health_check:
    endpoint: 127.0.0.1:14333
service:
  extensions:
  - file_storage
  - health_check
  telemetry:
    logs:
      level: error
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 14888
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/usage
      - transform/privacy
      exporters:
      - otlphttp/usage
